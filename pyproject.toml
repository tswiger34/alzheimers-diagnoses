[project]
name = "mstat-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "aiocsv>=1.4.0",
    "aiofiles>=25.1.0",
    "altair>=6.0.0",
    "dagster>=1.13.2",
    "dash>=4.1.0",
    "dbt-core>=1.11.7",
    "dbt-postgres>=1.10.0",
    "dcm2niix>=1.0.20260416",
    "ltsa",
    "matplotlib>=3.10.9",
    "nibabel>=5.4.2",
    "patito>=0.8.6",
    "plotly>=6.7.0",
    "polars>=1.38.1",
    "psycopg2-binary>=2.9.11",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.2",
    "simpleitk>=2.5.5",
    "sqlalchemy>=2.0.49",
    "torch>=2.12.0",
    "torchvision>=0.27.0",
    "torchio>=1.2.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "pandas>=3.0.1",
    "pyarrow>=23.0.1",
    "pytest>=9.0.2",
    "ruff>=0.15.17",
    "ty>=0.0.40",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu126", marker = "sys_platform == 'win32'" },
]
ltsa = { workspace = true }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.ty.src]

exclude = ["tests"]
[tool.sqlfluff.core]
templater = "dbt"
sql_file_exts = ".sql"
dialect = "postgres"
max_line_length = 120

[sqlfluff.templater.dbt]
project_dir = "./mstat_project_dbt/"

[tool.sqlfluff.indentation]
indented_joins = false
indented_using_on = true
template_blocks_indent = false

[tool.sqlfluff.templater]
unwrap_wrapped_queries = true

[tool.sqlfluff.templater.jinja]
apply_dbt_builtins = true

[tool.sqlfluff.rules.capitalisation.keywords]
capitalisation_policy = "upper"

[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]
include = ["src/**/*.py"]
respect-gitignore = true

line-length = 115
indent-width = 4

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = []

fixable = ["ALL"]

dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
quote-style = "double"

indent-style = "space"

skip-magic-trailing-comma = false

line-ending = "auto"

docstring-code-format = true

docstring-code-line-length = "dynamic"
