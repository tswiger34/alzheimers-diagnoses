version: 2

models:
  - name: core_image_set
    description: |
      The final set of images that will be used for analysis. The resulting data set will have represent 1 image,
      and be unique at the patient-visit code level. 

      Images were selected based on the following criteria:

        1. Must have no QC errors
        2. Must be in both the image manifest and key_mri datasets
        3. Must be an MPRAGE series type
        4. 

        4. If multiple images are available for a patient-visit code, then the following criteria are applied:
          a. *Post Processing*: All post processing > MP-RAGE > No post processing

    config:
      indexes:
        - type: btree
          unique: true
          columns: [image_id]
        - type: btree
          unique: true
          columns: [ptid, visit_code]

    columns:
      - name: image_id
        data_type: TEXT
        description: The unique identifier for each image in the ADNI image manifest
        data_tests:
          - not_null
          - unique
      - name: ptid
        data_type: TEXT
        description: The patient ID associated with the image
        data_tests:
          - not_null
      - name: study_id
        data_type: INTEGER
        description: The LONI study ID associated with the image
        data_tests:
          - not_null
      - name: visit_code
        data_type: TEXT
        description: |
          The normalized visit code associated with the image, which standardizes various
          formats for baseline visits (e.g., 'BL', 'SC', 'INIT', '4_BL', '4_INIT', '4_SC')
        data_tests:
          - not_null
      - name: image_date
        data_type: DATE
        description: The date the image was taken
        data_tests:
          - not_null
      - name: image_description
        data_type: TEXT
        description: The type of MRI image (e.g., "MP-RAGE", "SPGR", etc.)
        data_tests:
          - not_null
